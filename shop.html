<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Re:U｜Reverse Aging Salon オンラインショップ">
  <title>SHOP｜Re:U</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Noto Serif JP", serif; background: #f8f8f6; color: #252525; line-height: 1.8; }
    a { color: inherit; }
    header { background: #fff; border-bottom: 1px solid #e5e5df; }
    .header-inner { max-width: 1040px; margin: auto; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .brand { text-decoration: none; font-size: 22px; letter-spacing: .08em; }
    .back { text-decoration: none; font-size: 13px; color: #555; }
    main { max-width: 1040px; margin: auto; padding: 86px 24px 110px; min-height: 65vh; }
    .title { text-align: center; margin-bottom: 56px; }
    .title .eyebrow { margin: 0 0 8px; font-size: 12px; letter-spacing: .2em; color: #9b865c; }
    .title h1 { margin: 0; font-size: 34px; font-weight: 500; letter-spacing: .12em; }
    .title::after { content: ""; display: block; width: 44px; height: 1px; background: #b4a27c; margin: 25px auto 0; }
    .notice { max-width: 720px; margin: 0 auto; padding: 65px 26px; background: #fff; border: 1px solid #e7e3d9; text-align: center; }
    .notice h2 { margin: 0 0 20px; font-size: 22px; font-weight: 500; letter-spacing: .08em; }
    .notice p { margin: 0; color: #666; font-size: 14px; line-height: 2.2; }
    .notice a { display: inline-block; margin-top: 35px; padding: 12px 30px; border: 1px solid #b4a27c; text-decoration: none; font-size: 13px; letter-spacing: .08em; transition: .2s; }
    .notice a:hover { background: #b4a27c; color: #fff; }
    footer { padding: 28px 20px; border-top: 1px solid #e5e5df; text-align: center; font-size: 12px; }
    @media (max-width: 700px) { main { padding: 65px 18px 80px; } .notice { padding: 46px 20px; } .title h1 { font-size: 30px; } }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <a class="brand" href="index.html">Re:U</a>
    <a class="back" href="index.html">← TOPへ戻る</a>
  </div>
</header>
<main>
  <div class="title">
    <p class="eyebrow">Re:U ONLINE STORE</p>
    <h1>SHOP</h1>
  </div>
  <section class="notice" aria-labelledby="shop-notice-title">
    <h2 id="shop-notice-title">オンラインショップ準備中</h2>
    <p>ただいま商品ページを準備しております。<br>商品情報・お支払い方法が整い次第、こちらでご案内いたします。</p>
    <a href="index.html">トップページに戻る</a>
  </section>
</main>
<footer>© Re:U Reverse Aging Salon</footer>
</body>
</html>
